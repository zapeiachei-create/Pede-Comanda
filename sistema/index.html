;height:31px;border:0;border-radius:8px;background:#f6e3e7;color:var(--wine);font-size:18px;font-weight:900}.qty span{min-width:20px;text-align:center;font-weight:900}.price{text-align:right;font-weight:900}.summary{display:flex;justify-content:space-between;align-items:end;border-top:1px dashed #dbc9c5;padding-top:11px;margin-top:11px}.summary strong{font-size:29px;color:var(--wine);display:block}.send{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--wine),var(--wine2));color:white;font-size:16px;font-weight:900;margin-top:11px}
.status-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.status-tabs button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:8px 11px;font-weight:800}.status-tabs button.active{background:var(--wine);color:white;border-color:var(--wine)}.orders-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.order-card{background:white;border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:0 8px 20px rgba(40,0,8,.05)}.order-card .top{display:flex;justify-content:space-between;gap:10px}.order-card ul{padding-left:18px;margin:8px 0}.order-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.qr-card{background:linear-gradient(150deg,var(--wine3),var(--wine));color:#fff;border-radius:17px;padding:14px;text-align:center}.qr-card img{width:170px;height:170px;background:white;padding:8px;border-radius:11px}.qr-print-link{margin:9px auto 2px;font-size:11px;font-weight:900;word-break:break-all;opacity:.95}.logo-preview{width:90px;height:90px;border-radius:18px;border:1px dashed #c3a2a8;background:white;object-fit:cover;padding:5px}.color-row{display:flex;gap:8px;flex-wrap:wrap}.color-dot{width:34px;height:34px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #d8c8c5}.toast{position:fixed;right:14px;bottom:14px;background:#231f20;color:white;padding:11px 14px;border-radius:11px;z-index:100;box-shadow:var(--shadow);max-width:min(420px,90vw)}.mobile-nav{display:none}.loader{min-height:100vh;display:grid;place-items:center;background:#f7f3f1}.spinner{width:42px;height:42px;border:4px solid #ead5da;border-top-color:var(--wine);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.small{font-size:12px}.danger-note{background:#fff1f3;border:1px solid #f1c5cd;color:#85202e;padding:10px;border-radius:10px}.success-note{background:#e9f8f0;border:1px solid #bde8d2;color:#166b47;padding:10px;border-radius:10px}.table-session-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}.table-session-card{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;min-width:0}.table-session-card.free{background:#fbfcfb}.table-session-card.occupied{background:#fff5f6;border-color:#e6b9c1}.table-session-top{display:flex;align-items:center;justify-content:space-between;gap:7px}.table-state{font-size:10px;font-weight:1000;letter-spacing:.06em;padding:4px 7px;border-radius:999px}.free-state{background:#dcf6e8;color:#14764a}.occupied-state{background:#f7dbe0;color:#8f1020}.table-customer{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.auth{grid-template-columns:1fr}.hero{padding:34px 22px 12px}.system-logo{gap:12px}.system-icon{width:72px;height:72px;border-radius:19px}.system-icon span{font-size:33px;letter-spacing:-6px}.system-name{font-size:37px;letter-spacing:-1.5px}.system-sub{font-size:9px;letter-spacing:.26em;margin-top:7px}.hero-tagline{font-size:20px;margin-top:22px}.authbox{margin:8px auto 28px}.layout{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px 12px 84px}.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.orders-list{grid-template-columns:1fr}.triplet{grid-template-columns:1fr}.menu-row{grid-template-columns:1fr 90px}.menu-row .price{grid-column:1/-1}.mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px;justify-content:space-around}.mobile-nav button{border:0;background:transparent;color:#655a58;font-size:10px;padding:5px 4px}.mobile-nav button.active{color:var(--wine);font-weight:900}.page-head h1{font-size:30px}.topbar{padding:9px 10px}.brandtxt small{display:none}.hide-mobile{display:none!important}}

/* Ajuste mobile compacto - Pede Comanda */
@media(max-width:900px){
  html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
  body{position:relative}
  #app,.layout,.main{width:100%;max-width:100vw;min-width:0;overflow-x:hidden}

  .page-head>div{flex:1 1 220px;min-width:0;max-width:100%}
  .page-head>.btn{flex:0 0 auto;margin-left:auto;padding:8px 10px;font-size:13px;white-space:nowrap;max-width:44%}
  .page-head h1{font-size:24px;line-height:1.08;overflow-wrap:anywhere}
  .page-head h2{font-size:20px;line-height:1.1}
  .page-head .muted{font-size:14px;line-height:1.28;margin-top:4px}
  .grid{gap:10px;width:100%;max-width:100%;min-width:0}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3,.grid-2{grid-template-columns:1fr}
  .card{width:100%;max-width:100%;min-width:0;border-radius:15px;padding:13px;box-shadow:0 7px 22px rgba(72,10,20,.08);overflow:hidden}
  .stat{min-height:94px}
  .stat span{font-size:12px;line-height:1.2}

  .table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table{min-width:620px}
  .table th,.table td{padding:9px 8px;font-size:12px}
  .table th{font-size:10px}
  .orders-list{gap:9px}
  .order-card{padding:11px;border-radius:13px;min-width:0}

  .mobile-nav{padding:4px 3px calc(4px + env(safe-area-inset-bottom));width:100%;max-width:100vw;overflow:hidden}
  .mobile-nav button{font-size:9px;padding:4px 2px;min-width:0;flex:1}
  .toolbar{gap:6px;min-width:0}
  .btn{padding:9px 11px;border-radius:10px}
  .btn-sm{padding:6px 8px;font-size:12px}
  .toast{left:10px;right:10px;bottom:72px;max-width:none}
}
@media(max-width:430px){
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}

  .page-head>.btn{max-width:100%;margin-left:0}
}

<body><div id="app"><div class="loader"><div class="spinner"></div></div></div>
<script>
const SUPABASE_URL='https://aajpumelbbgutmeackuu.supabase.co';
const PUBLIC_CLIENT_BASE='https://zapeiachei-create.github.io/Pede-Comanda/';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhanB1bWVsYmJndXRtZWFja3V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0MzUwODQsImV4cCI6MjA3NTAxMTA4NH0.6SoJ0vQy5F33IOeVjMllxPv7SlST6dpaGJMlvPceLVk';
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const fmtTime=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let session=JSON.parse(localStorage.getItem('pc_auth')||'null');
let staffSession=JSON.parse(localStorage.getItem('pc_staff')||'null');
let appMode='admin', view='dashboard', user=null, business=null, data={staff:[],tables:[],categories:[],products:[],addons:[],variants:[],orders:[],items:[],sessions:[]};
let draft={tableId:'',qty:{},addons:{},lines:[],config:{},notes:'',customer:''}; let kitchenFilter='new'; let poller=null; let logoData=''; let addonProductId=null; let variantProductId=null;

function headers(auth=true){const token=auth&&session?.access_token?session.access_token:SUPABASE_KEY;return {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'};}
async function api(path,opt={}){const res=await fetch(SUPABASE_URL+path,{...opt,headers:{...headers(opt.auth!==false),...(opt.headers||{})}});const txt=await res.text();let out=null;try{out=txt?JSON.parse(txt):null}catch{out=txt}if(!res.ok)throw new Error(out?.message||out?.error_description||out?.hint||out?.details||String(out||res.status));return out;}
async function rest(table,query='',opt={}){return api(`/rest/v1/${table}${query?('?'+query):''}`,opt)}
async function rpc(name,body={},auth=true){return api(`/rest/v1/rpc/${name}`,{method:'POST',body:JSON.stringify(body),auth});}
function toast(msg){const old=$('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function setTheme(color){document.documentElement.style.setProperty('--wine',color||'#7b0f1b');document.documentElement.style.setProperty('--wine2',shade(color||'#7b0f1b',18));document.documentElement.style.setProperty('--wine3',shade(color||'#7b0f1b',-30));document.querySelector('meta[name=theme-color]')?.setAttribute('content',color||'#7b0f1b')}
function shade(hex,p){let f=parseInt(hex.slice(1),16),t=p<0?0:255,P=Math.abs(p)/100,R=f>>16,G=f>>8&255,B=f&255;return '#'+(0x1000000+(Math.round((t-R)*P)+R)*0x10000+(Math.round((t-G)*P)+G)*0x100+(Math.round((t-B)*P)+B)).toString(16).slice(1)}
function slugify(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)}

async function init(){const u=new URL(location.href);const qr=u.searchParams.get('qr');if(qr){appMode='qr';return loadQR(qr)}if(staffSession?.session_token){try{appMode='staff';return await loadStaff()}catch(e){localStorage.removeItem('pc_staff');staffSession=null}}
if(session?.refresh_token){try{await restoreAuth();return await loadAdmin()}catch(e){localStorage.removeItem('pc_auth');session=null}}
renderAuth();}
async function restoreAuth(){try{user=await api('/auth/v1/user',{auth:true})}catch(e){const r=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token}),auth:false});session=r;localStorage.setItem('pc_auth',JSON.stringify(session));user=r.user;}}

function renderAuth(tab='admin'){clearPoll();setTheme('#7b0f1b');appMode='auth';document.getElementById('app').innerHTML=`<div class="auth"><section class="hero"><div class="system-logo"><div class="system-icon"><span>PC</span></div><div class="system-word"><div class="system-name"><b>Pede</b> Comanda</div><div class="system-sub">SISTEMA MULTILOJAS</div></div></div><div class="hero-tagline">Sua comanda digital online</div></section><section class="authbox"><h2 style="margin-top:0">Acessar o sistema</h2><div class="auth-tabs"><button class="${tab==='admin'?'active':''}" onclick="renderAuth('admin')">Administrador</button><button class="${tab==='staff'?'active':''}" onclick="renderAuth('staff')">Equipe / Garçom</button></div>${tab==='admin'?adminLoginHtml():staffLoginHtml()}</section></div>`;}
function adminLoginHtml(){return `<div class="login-switch"><button class="btn btn-soft" onclick="showAdminLogin(false)">Entrar</button><button class="btn btn-secondary" onclick="showAdminLogin(true)">Criar conta</button></div><div id="adminAuthBox">${loginForm(false)}</div>`}
function showAdminLogin(signup){$('#adminAuthBox').innerHTML=loginForm(signup)}
function loginForm(signup){return `<div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input id="pass" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="mínimo 6 caracteres"></div>${signup?`<div class="field"><label>Confirmar senha</label><input id="pass2" type="password"></div>`:''}<button class="btn btn-primary btn-block" onclick="adminAuth(${signup})">${signup?'Criar minha conta':'Entrar'}</button><p class="muted small" style="margin-bottom:0">${signup?'Depois do cadastro, você criará o estabelecimento e personalizará a comanda.':'Acesso do dono/administrador do estabelecimento.'}</p>`}
async function adminAuth(signup){const email=$('#email').value.trim(),pass=$('#pass').value;if(!email||pass.length<6)return toast('Informe e-mail e senha com pelo menos 6 caracteres.');if(signup&&pass!==$('#pass2').value)return toast('As senhas não conferem.');try{if(signup){const r=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password:pass}),auth:false});if(r.access_token){session=r;user=r.user;localStorage.setItem('pc_auth',JSON.stringify(session));return loadAdmin()}toast('Conta criada. Se o e-mail de confirmação estiver ativo, confirme o e-mail e depois entre.');showAdminLogin(false)}else{const r=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:pass}),auth:false});session=r;user=r.user;localStorage.setItem('pc_auth',JSON.stringify(session));await loadAdmin()}}catch(e){toast(e.message)}}
function staffLoginHtml(){return `<div class="field"><label>Código da empresa</label><input id="bizSlug" placeholder="ex.: lanchonete-do-joao"></div><div class="field"><label>PIN do atendente</label><input id="staffPin" inputmode="numeric" type="password" maxlength="6" placeholder="4 a 6 números"></div><button class="btn btn-primary btn-block" onclick="doStaffLogin()">Entrar como equipe</button><p class="muted small" style="margin-bottom:0">O dono cadastra cada garçom, cozinha ou caixa com um PIN próprio.</p>`}
async function doStaffLogin(){try{const r=await rpc('pc_staff_login',{p_business_slug:$('#bizSlug').value.trim(),p_pin:$('#staffPin').value.trim()},false);staffSession=r;localStorage.setItem('pc_staff',JSON.stringify(r));appMode='staff';draft={tableId:'',qty:{},addons:{},notes:'',customer:''};await loadStaff()}catch(e){toast(e.message)}}

async function loadAdmin(){clearPoll();appMode='admin';try{if(!user)user=await api('/auth/v1/user');const bs=await rest('pc_businesses','select=*&order=created_at.asc&limit=1');business=bs?.[0]||null;if(!business)return renderOnboarding();setTheme(business.theme_color);await reloadAdminData();view='dashboard';renderAdmin();poller=setInterval(()=>{if(['dashboard','kitchen'].includes(view))refreshOrders(false)},4000)}catch(e){toast(e.message);renderAuth('admin')}}
function renderOnboarding(){clearPoll();document.getElementById('app').innerHTML=`<div class="onboard"><div class="card"><span class="step">PASSO 1 DE 1</span><h1>Crie seu estabelecimento</h1><p class="muted">Cada cliente do Pede Comanda terá sua própria empresa, equipe, comanda e pedidos separados.</p><div class="field"><label>Nome do estabelecimento</label><input id="onName" placeholder="Ex.: Restaurante do João" oninput="$('#onSlug').value=slugify(this.value)"></div><div class="field"><label>Código da empresa</label><input id="onSlug" placeholder="restaurante-do-joao"><div class="muted small">Esse código será usado no login da equipe e no link público.</div></div><div class="field"><label>Tipo de atendimento</label><select id="onMode" onchange="toggleOnboardingTables()"><option value="tables">Mesas — restaurante/bar</option><option value="counter">Balcão / Retirada — trailer, food truck, quiosque</option><option value="mixed">Misto — mesas + balcão/retirada</option></select></div><div class="field" id="onTablesWrap"><label>Quantas mesas o estabelecimento possui?</label><input id="onTableCount" type="number" inputmode="numeric" min="1" max="500" value="12"><div class="muted small">O sistema já cria todos os QR Codes das mesas automaticamente. Depois você pode aumentar essa quantidade.</div></div><div class="field"><label>WhatsApp da cozinha (opcional)</label><input id="onWpp" inputmode="tel" placeholder="5521999999999"></div><button class="btn btn-primary btn-block" onclick="createBusiness()">Criar Pede Comanda</button><button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="logoutAdmin()">Sair</button></div></div>`}
function toggleOnboardingTables(){const mode=$('#onMode')?.value;const wrap=$('#onTablesWrap');if(wrap)wrap.style.display=mode==='counter'?'none':'grid'}
async function createBusiness(){const name=$('#onName').value.trim(),slug=slugify($('#onSlug').value||name),wpp=$('#onWpp').value.replace(/\D/g,''),mode=$('#onMode').value,tableCount=Math.max(1,Math.min(500,Number($('#onTableCount')?.value||12)));if(!name||!slug)return toast('Informe o nome do estabelecimento.');try{business=await rpc('pc_create_business',{p_name:name,p_slug:slug,p_kitchen_whatsapp:wpp||null,p_service_mode:mode,p_table_count:tableCount},true);toast(mode==='counter'?'Estabelecimento criado.':`Estabelecimento criado com ${tableCount} mesas.`);setTheme(business.theme_color);await reloadAdminData();view='dashboard';renderAdmin();poller=setInterval(()=>{if(['dashboard','kitchen'].includes(view))refreshOrders(false)},4000)}catch(e){toast(e.message)}}
async function reloadAdminData(){const bid=business.id;const [staff,tables,cats,products,addons,variants,sessions]=await Promise.all([rest('pc_staff',`select=id,name,role,active,created_at&business_id=eq.${bid}&order=created_at.asc`),rest('pc_tables',`select=*&business_id=eq.${bid}&order=sort_order.asc,name.asc`),rest('pc_categories',`select=*&business_id=eq.${bid}&order=sort_order.asc,name.asc`),rest('pc_products',`select=*&business_id=eq.${bid}&order=sort_order.asc,name.asc`),rest('pc_product_addons',`select=*&business_id=eq.${bid}&order=sort_order.asc,name.asc`),rest('pc_product_variants',`select=*&business_id=eq.${bid}&order=sort_order.asc,name.asc`),rest('pc_table_sessions',`select=*&business_id=eq.${bid}&status=eq.open&order=opened_at.asc`)]);data.staff=staff;data.tables=tables;data.categories=cats;data.products=products;data.addons=addons||[];data.variants=variants||[];data.sessions=sessions||[];await refreshOrders(false)}
async function refreshOrders(rerender=true){if(!business)return;try{const [orders,items]=await Promise.all([rest('pc_orders',`select=*&business_id=eq.${business.id}&order=created_at.desc&limit=150`),rest('pc_order_items',`select=*&business_id=eq.${business.id}&order=created_at.asc&limit=1000`)]);data.orders=orders;data.items=items;if(rerender)renderAdmin()}catch(e){console.warn(e)}}
function brandHtml(){const logo=business?.logo_url?`<img class="logo-mini" src="${esc(business.logo_url)}">`:`<div class="brandmark">PC</div>`;return `${logo}<div class="brandtxt"><strong>${esc(business?.name||'Pede Comanda')}</strong><small>Pede Comanda • Administrador</small></div>`}
function renderAdmin(){appMode='admin';document.documentElement.scrollLeft=0;document.body.scrollLeft=0;document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand">${brandHtml()}</div><div class="toolbar"><button class="btn btn-secondary hide-mobile" onclick="openStaffLoginHint()">Abrir atendimento</button><button class="btn btn-secondary" onclick="logoutAdmin()">Sair</button></div></header><div class="layout"><aside class="sidebar">${nav('dashboard','▦','Visão geral')}${nav('kitchen','👨‍🍳','Cozinha')}${nav('menu','☰','Cardápio da comanda')}${nav('staff','👤','Equipe')}${nav('tables','▦','QR / Links')}${nav('settings','⚙','Configurações')}</aside><main class="main">${adminView()}</main></div><nav class="mobile-nav">${mnav('dashboard','▦','Visão')}${mnav('kitchen','👨‍🍳','Cozinha')}${mnav('menu','☰','Comanda')}${mnav('staff','👤','Equipe')}${mnav('tables','▦','QR/Link')}${mnav('settings','⚙','Config.')}</nav>`}
function nav(v,ico,label){return `<button class="navbtn ${view===v?'active':''}" onclick="go('${v}')"><span>${ico}</span>${label}</button>`}function mnav(v,ico,label){return `<button class="${view===v?'active':''}" onclick="go('${v}')"><div>${ico}</div>${label}</button>`}function go(v){view=v;if(v==='kitchen')refreshOrders(false);renderAdmin()}
function adminView(){return ({dashboard:dashboardView,kitchen:kitchenAdminView,menu:menuAdminView,staff:staffAdminView,tables:tablesAdminView,settings:settingsAdminView}[view]||dashboardView)()}
function dashboardView(){const live=data.orders.filter(o=>!['delivered','cancelled'].includes(o.status));const done=data.orders.filter(o=>o.status==='delivered');const total=done.reduce((a,o)=>a+Number(o.total),0);return `<div class="page-head"><div><h1>Visão geral</h1><div class="muted">Acompanhe a operação do estabelecimento.</div></div><button class="btn btn-primary" onclick="openStaffLoginHint()">+ Atendimento</button></div><div class="grid grid-4"><div class="card stat"><span>Pedidos</span><b>${data.orders.length}</b></div><div class="card stat"><span>Em aberto</span><b>${live.length}</b></div><div class="card stat"><span>Faturamento entregue</span><b>${money(total)}</b></div><div class="card stat"><span>Ticket médio</span><b>${money(done.length?total/done.length:0)}</b></div></div>${tableSessionsPanel()}<div class="card" style="margin-top:14px"><div class="page-head"><div><h2>Últimos pedidos</h2><div class="muted">Atualização automática.</div></div><button class="btn btn-soft" onclick="refreshOrders()">Atualizar</button></div>${ordersTable(data.orders.slice(0,12))}</div>`}
function tableSessionsPanel(){
  if(!['tables','mixed'].includes(business?.service_mode||'tables'))return '';
  const occupied=(data.sessions||[]).length;
  const freeCount=Math.max(0,(data.tables||[]).length-occupied);
  const cards=(data.tables||[]).map(t=>{
    const s=(data.sessions||[]).find(x=>x.table_id===t.id);
    if(!s)return `<div class="table-session-card free"><div class="table-session-top"><b>${esc(t.name)}</b><span class="table-state free-state">LIVRE</span></div><div class="muted small">Pronta para novo atendimento</div></div>`;
    const os=(data.orders||[]).filter(o=>o.table_session_id===s.id&&o.status!=='cancelled');
    const total=os.reduce((a,o)=>a+Number(o.total||0),0);
    const people=[...new Set(os.map(o=>(o.customer_name||'').trim()).filter(Boolean))];
    const names=people.length?people.slice(0,3).join(', ')+(people.length>3?'…':''):'Clientes da mesa';
    return `<div class="table-session-card occupied"><div class="table-session-top"><b>${esc(t.name)}</b><span class="table-state occupied-state">OCUPADA</span></div><div class="small">${os.length} pedido${os.length===1?'':'s'} • <b>${money(total)}</b></div><div class="muted small table-customer">${esc(names)}</div><button class="btn btn-danger btn-sm btn-block" onclick="closeTableSession('${t.id}','${esc(t.name)}')">Encerrar mesa</button></div>`;
  }).join('');
  return `<div class="card table-session-panel" style="margin-top:14px"><div class="page-head"><div><h2 style="margin:0">Mesas agora</h2><div class="muted">${occupied} ocupada${occupied===1?'':'s'} • ${freeCount} livre${freeCount===1?'':'s'}</div></div><button class="btn btn-soft btn-sm" onclick="reloadAdminData().then(renderAdmin)">Atualizar</button></div><div class="table-session-grid">${cards}</div></div>`;
}
async function closeTableSession(tableId,tableName){
  if(!confirm(`Encerrar ${tableName}?\n\nIsso fecha a conta desta ocupação, marca os pedidos como entregues e libera a mesa para a próxima família.`))return;
  try{
    const r=await rpc('pc_close_table_session',{p_table_id:tableId});
    await reloadAdminData();
    renderAdmin();
    toast(`${tableName} encerrada • Total ${money(r.total)} • Mesa livre`);
  }catch(e){toast(e.message)}
}

function orderPlace(o){return o.channel==='counter'?`Senha ${String(o.pickup_no||0).padStart(3,'0')} • Balcão`:tableName(o.table_id)}
function orderOrigin(o){return o.channel==='counter'?'Cliente / Link':o.channel==='qr'?'Cliente / QR':staffName(o.staff_id)}
function ordersTable(rows){if(!rows.length)return `<div class="empty">Nenhum pedido ainda.</div>`;return `<div class="table-wrap"><table class="table"><thead><tr><th>Pedido</th><th>Mesa / Retirada</th><th>Origem</th><th>Status</th><th>Total</th><th>Hora</th></tr></thead><tbody>${rows.map(o=>`<tr><td>#${o.order_no}</td><td>${esc(orderPlace(o))}</td><td>${esc(orderOrigin(o))}</td><td>${badge(o.status)}</td><td>${money(o.total)}</td><td>${fmtTime(o.created_at)}</td></tr>`).join('')}</tbody></table></div>`}
function tableName(id){return data.tables.find(t=>t.id===id)?.name||'Balcão / Retirada'}function staffName(id){return data.staff.find(s=>s.id===id)?.name||'—'}
function badge(s){const m={new:['Novo','b-new'],preparing:['Em preparo','b-prep'],ready:['Pronto','b-ready'],delivered:['Entregue','b-done'],cancelled:['Cancelado','b-cancel']};const x=m[s]||[s,'b-done'];return `<span class="badge ${x[1]}">${x[0]}</span>`}
function kitchenAdminView(){const statuses=[['new','Novos'],['preparing','Em preparo'],['ready','Prontos'],['delivered','Entregues']];const rows=data.orders.filter(o=>o.status===kitchenFilter);return `<div class="page-head"><div><h1>Cozinha</h1><div class="muted">Pedidos em tempo real, adaptado ao celular.</div></div><button class="btn btn-soft" onclick="refreshOrders()">Atualizar</button></div><div class="status-tabs">${statuses.map(([s,n])=>`<button class="${kitchenFilter===s?'active':''}" onclick="kitchenFilter='${s}';renderAdmin()">${n} (${data.orders.filter(o=>o.status===s).length})</button>`).join('')}</div><div class="orders-list">${rows.map(orderCardAdmin).join('')||'<div class="card empty">Nenhum pedido neste status.</div>'}</div>`}
function itemsOf(oid){return data.items.filter(i=>i.order_id===oid)}
function addonText(list){return Array.isArray(list)&&list.length?`<div class="muted small" style="margin-top:2px">+ ${list.map(a=>esc(a.name)).join(', ')}</div>`:''}
function orderCardAdmin(o){const next={new:['Iniciar preparo','preparing'],preparing:['Marcar pronto','ready'],ready:['Entregar','delivered']}[o.status];const main=o.channel==='counter'?`SENHA ${String(o.pickup_no||0).padStart(3,'0')} • Balcão`:`#${o.order_no} • ${tableName(o.table_id)}`;return `<article class="order-card"><div class="top"><div><b>${esc(main)}</b><div class="muted">${fmtTime(o.created_at)} • ${esc(orderOrigin(o))}</div></div>${badge(o.status)}</div><ul>${itemsOf(o.id).map(i=>`<li>${i.quantity}x ${esc(i.product_name)}${addonText(i.addons)}</li>`).join('')}</ul>${['qr','counter'].includes(o.channel)&&(o.customer_name||o.customer_whatsapp)?`<div class="muted"><b>Cliente:</b> ${esc(o.customer_name||'Não informado')}${o.customer_whatsapp?` • WhatsApp ${esc(o.customer_whatsapp)}`:''}</div>`:''}${o.notes?`<div class="muted"><b>Obs.:</b> ${esc(o.notes)}</div>`:''}<div class="inline" style="justify-content:space-between;margin-top:10px"><b>${money(o.total)}</b><div class="order-actions">${next?`<button class="btn btn-primary btn-sm" onclick="adminStatus('${o.id}','${next[1]}')">${next[0]}</button>`:''}${o.status!=='cancelled'&&o.status!=='delivered'?`<button class="btn btn-danger btn-sm" onclick="adminStatus('${o.id}','cancelled')">Cancelar</button>`:''}</div></div></article>`}
async function adminStatus(id,status){try{await rest('pc_orders',`id=eq.${id}&business_id=eq.${business.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status,updated_at:new Date().toISOString()})});await refreshOrders();}catch(e){toast(e.message)}}

function menuAdminView(){return `<div class="page-head"><div><h1>Cardápio da comanda</h1><div class="muted">Cadastre produtos, opções de massa e adicionais grátis ou pagos.</div></div><button class="btn btn-primary" onclick="addCategory()">+ Categoria</button></div>${data.categories.map(c=>`<div class="card" style="margin-bottom:12px"><div class="page-head"><div><h3 style="margin:0">${esc(c.name)}</h3></div><button class="btn btn-soft btn-sm" onclick="addProduct('${c.id}')">+ Item</button></div>${productRows(c.id)}</div>`).join('')||'<div class="card empty">Nenhuma categoria cadastrada.</div>'}${variantProductId?variantEditor():''}${addonProductId?addonEditor():''}`}
function productRows(cid){const ps=data.products.filter(p=>p.category_id===cid);if(!ps.length)return '<div class="empty">Sem itens nessa categoria.</div>';return `<div class="table-wrap"><table class="table"><tbody>${ps.map(p=>{const ac=data.addons.filter(a=>a.product_id===p.id&&a.active).length;const vc=data.variants.filter(v=>v.product_id===p.id&&v.active).length;return `<tr><td><b>${esc(p.name)}</b><div class="muted small">${vc?`${vc} opções/massas • `:''}${ac?`${ac} adicionais`:'Sem adicionais'}</div></td><td>${money(p.price)}</td><td>${p.active?'<span class="badge b-ready">Ativo</span>':'<span class="badge b-done">Inativo</span>'}</td><td><div class="toolbar"><button class="btn btn-soft btn-sm" onclick="variantProductId='${p.id}';addonProductId=null;renderAdmin()">Massas/Opções</button><button class="btn btn-soft btn-sm" onclick="addonProductId='${p.id}';variantProductId=null;renderAdmin()">Adicionais</button><button class="btn btn-secondary btn-sm" onclick="editProduct('${p.id}')">Editar</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function variantEditor(){
  const p=data.products.find(x=>x.id===variantProductId);
  if(!p){variantProductId=null;return '';}
  const rows=data.variants.filter(v=>v.product_id===p.id);
  return `<div class="card addon-admin"><div class="page-head"><div><h2 style="margin:0">Massas / Opções de ${esc(p.name)}</h2><div class="muted">O cliente escolhe uma opção antes dos adicionais. Ex.: Natural, Beterraba, Alho.</div></div><div class="toolbar"><button class="btn btn-primary btn-sm" onclick="newVariant('${p.id}')">+ Massa/Opção</button><button class="btn btn-secondary btn-sm" onclick="variantProductId=null;renderAdmin()">Fechar</button></div></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Opção</th><th>Acréscimo</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(v=>`<tr><td><b>${esc(v.name)}</b></td><td>${Number(v.price_delta)>0?'+'+money(v.price_delta):'<span class="badge b-ready">Sem acréscimo</span>'}</td><td>${v.active?'<span class="badge b-ready">Ativo</span>':'<span class="badge b-done">Inativo</span>'}</td><td><div class="toolbar"><button class="btn btn-soft btn-sm" onclick="editVariant('${v.id}')">Editar</button><button class="btn btn-danger btn-sm" onclick="removeVariant('${v.id}')">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma massa/opção cadastrada para este produto.</div>'}</div>`;
}
async function newVariant(productId){
  const name=prompt('Nome da massa/opção, por exemplo: Natural, Beterraba ou Alho');if(!name)return;
  const raw=prompt('Acréscimo desta opção. Digite 0 se não houver.','0');if(raw===null)return;
  const price_delta=Math.max(0,Number(String(raw).replace(',','.'))||0);
  try{await rest('pc_product_variants','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({business_id:business.id,product_id:productId,name:name.trim(),price_delta,sort_order:data.variants.filter(v=>v.product_id===productId).length*10+10})});await reloadAdminData();variantProductId=productId;renderAdmin();toast('Massa/opção cadastrada.')}catch(e){toast(e.message)}
}
async function editVariant(id){
  const v=data.variants.find(x=>x.id===id);if(!v)return;
  const name=prompt('Nome da massa/opção',v.name);if(name===null)return;
  const raw=prompt('Acréscimo desta opção. Use 0 se não houver.',String(v.price_delta).replace('.',','));if(raw===null)return;
  const price_delta=Math.max(0,Number(String(raw).replace(',','.'))||0);
  const active=confirm('Deixar esta massa/opção ativa? OK para ativo, Cancelar para inativo.');
  try{await rest('pc_product_variants',`id=eq.${id}&business_id=eq.${business.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({name:name.trim(),price_delta,active})});await reloadAdminData();renderAdmin();toast('Massa/opção atualizada.')}catch(e){toast(e.message)}
}
async function removeVariant(id){
  const v=data.variants.find(x=>x.id===id);if(!v)return;
  if(!confirm(`Excluir a massa/opção "${v.name}"?`))return;
  try{await rest('pc_product_variants',`id=eq.${id}&business_id=eq.${business.id}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});await reloadAdminData();renderAdmin();toast('Massa/opção excluída.')}catch(e){toast(e.message)}
}

function addonEditor(){
  const p=data.products.find(x=>x.id===addonProductId);
  if(!p){addonProductId=null;return '';}
  const rows=data.addons.filter(a=>a.product_id===p.id);
  return `<div class="card addon-admin"><div class="page-head"><div><h2 style="margin:0">Adicionais de ${esc(p.name)}</h2><div class="muted">Preço 0 = grátis. Preço maior que 0 = adicional pago.</div></div><div class="toolbar"><button class="btn btn-primary btn-sm" onclick="newAddon('${p.id}')">+ Adicional</button><button class="btn btn-secondary btn-sm" onclick="addonProductId=null;renderAdmin()">Fechar</button></div></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Adicional</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${Number(a.price)>0?money(a.price):'<span class="badge b-ready">Grátis</span>'}</td><td>${a.active?'<span class="badge b-ready">Ativo</span>':'<span class="badge b-done">Inativo</span>'}</td><td><div class="toolbar"><button class="btn btn-soft btn-sm" onclick="editAddon('${a.id}')">Editar</button><button class="btn btn-danger btn-sm" onclick="removeAddon('${a.id}')">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum adicional cadastrado para este produto.</div>'}</div>`;
}
async function newAddon(productId){
  const name=prompt('Nome do adicional, por exemplo: queijo extra, bacon, milho ou ovo');
  if(!name)return;
  const raw=prompt('Preço do adicional. Digite 0 para grátis.','0');
  if(raw===null)return;
  const price=Math.max(0,Number(String(raw).replace(',','.'))||0);
  try{
    await rest('pc_product_addons','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({business_id:business.id,product_id:productId,name:name.trim(),price,sort_order:data.addons.filter(a=>a.product_id===productId).length*10+10})});
    await reloadAdminData();addonProductId=productId;renderAdmin();toast(price>0?'Adicional pago cadastrado.':'Adicional grátis cadastrado.');
  }catch(e){toast(e.message)}
}
async function editAddon(id){
  const a=data.addons.find(x=>x.id===id);if(!a)return;
  const name=prompt('Nome do adicional',a.name);if(name===null)return;

async function urlToDataUrl(url){
  const r=await fetch(url);
  if(!r.ok)throw new Error('Não foi possível carregar o QR.');
  const b=await r.blob();
  return await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(b)});
}

  const t=data.tables.find(x=>x.id===tableId);

function tablesAdminView(){const base=PUBLIC_CLIENT_BASE.replace(/\/$/,'');const mode=business.service_mode||'tables';const counterLink=`${base}?loja=${encodeURIComponent(business.slug)}`;const counterQr=`https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=${encodeURIComponent(counterLink)}`;const showCounter=['counter','mixed'].includes(mode),showTables=['tables','mixed'].includes(mode);return `<div class="page-head"><div><h1>QR Codes e Links</h1><div class="muted">Cliente entra sem cadastro: por QR Code ou pelo link público do estabelecimento.</div></div>${showTables?`<div class="toolbar"><button class="btn btn-soft" onclick="printAllTableArts()">Imprimir todas</button><button class="btn btn-primary" onclick="generateTables()">Gerar mesas</button></div>`:''}</div>${showTables?`<div class="card" style="margin-bottom:14px"><div class="page-head"><div><h2 style="margin:0">Mesas cadastradas: ${data.tables.length}</h2><div class="muted">Informe o total de mesas do restaurante e o sistema cria automaticamente apenas as que estiverem faltando, cada uma com seu QR Code exclusivo.</div></div><button class="btn btn-soft" onclick="generateTables()">+ Gerar mais mesas</button></div></div>`:''}${showCounter?`<div class="card" style="margin-bottom:14px"><div class="page-head"><div><h2 style="margin:0">Balcão / Retirada</h2><div class="muted">Ideal para trailer, food truck, quiosque e lanchonete sem mesas. Cada pedido recebe uma senha automática.</div></div></div><div class="grid grid-2"><div><div class="field"><label>Link do estabelecimento</label><input value="${esc(counterLink)}" readonly><div class="muted small" style="margin-top:6px"><b>Link para impressão:</b> ${esc(brandedStoreLink())}</div></div><div class="toolbar"><button class="btn btn-primary btn-sm" onclick="copyText('${counterLink}')">Copiar link</button><button class="btn btn-secondary btn-sm" onclick="window.open('${counterLink}','_blank')">Abrir</button><button class="btn btn-secondary btn-sm" onclick="shareClientLink('Balcão / Retirada','${counterLink}')">Compartilhar</button></div><p class="muted small">Você também pode encurtar esse link e imprimir junto do QR Code.</p></div><div style="text-align:center"><img src="${counterQr}" alt="QR Balcão" style="width:190px;height:190px;background:#fff;padding:8px;border-radius:12px;border:1px solid var(--line)"><div class="small muted">QR geral do estabelecimento</div></div></div></div>`:''}${showTables?`<div class="success-note" style="margin-bottom:12px"><b>QR por mesa.</b> Cada mesa abre a própria comanda automaticamente.</div><div class="qr-grid">${data.tables.map(t=>{const link=`${base}?qr=${t.qr_token}`;const qr=`https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=${encodeURIComponent(link)}`;return `<div class="qr-card"><h3>${esc(t.name)}</h3><img src="${qr}" alt="QR ${esc(t.name)}"><div class="qr-print-link">${esc(brandedTableLink(t))}</div><p class="small">Abre direto a comanda desta mesa, sem cadastro.</p><div class="toolbar" style="justify-content:center"><button class="btn btn-secondary btn-sm" onclick="copyText('${link}')">Copiar link</button><button class="btn btn-secondary btn-sm" onclick="window.open('${link}','_blank')">Abrir</button><button class="btn btn-secondary btn-sm" onclick="downloadTableArt('${t.id}')">Baixar arte</button><button class="btn btn-secondary btn-sm" onclick="printTableArt('${t.id}')">Imprimir</button><button class="btn btn-secondary btn-sm" onclick="shareClientLink('${esc(t.name)}','${link}')">Compartilhar</button></div></div>`}).join('')}</div>`:''}${!showCounter&&!showTables?'<div class="card empty">Escolha o tipo de atendimento em Configurações.</div>':''}`}

iv class="field"><label>WhatsApp da cozinha</label><input id="setWpp" inputmode="tel" value="${esc(business.kitchen_whatsapp||'')}" placeholder="5521999999999"></div><div class="field"><label>Endereço público do Pede Comanda</label><input value="${PUBLIC_CLIENT_BASE}" disabled><div class="muted small">O sistema gera links de mesa e também um link geral para balcão/retirada.</div></div><button class="btn btn-primary" onclick="saveOperation()">Salvar operação</button><div class="success-note" style="margin-top:14px">Pedidos por mesa, balcão e garçom ficam centralizados na mesma cozinha.</div></div></div>`}

function staffBrand(){const logo=staffSession.logo_url?`<img class="logo-mini" src="${esc(staffSession.logo_url)}">`:`<div class="brandmark">PC</div>`;return `${logo}<div class="brandtxt"><strong>${esc(staffSession.business_name)}</strong><small>${esc(staffSession.staff_name)} • ${roleLabel(staffSession.role)}</small></div>`}
function renderStaff(){document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand">${staffBrand()}</div><button class="btn btn-secondary" onclick="logoutStaff()">Sair</button></header><main class="main">${view==='kitchen'?staffKitchenView():staffComandaView()}</main><nav class="mobile-nav">${staffSession.role!=='kitchen'?`<button class="${view==='comanda'?'active':''}" onclick="view='comanda';renderStaff()"><div>🧾</div>Comanda</button>`:''}<button class="${view==='kitchen'?'active':''}" onclick="view='kitchen';loadStaffOrders(true)"><div>👨‍🍳</div>Cozinha</button></nav>`}
function staffComandaView(){const cats=staffSession.categories||[];const mode=staffSession.service_mode||'tables';const canCounter=['counter','mixed'].includes(mode),canTables=['tables','mixed'].includes(mode);const options=(canCounter?`<option value="" ${draft.tableId===''?'selected':''}>Balcão / Retirada</option>`:'')+(canTables?(staffSession.tables||[]).map(t=>`<option value="${t.id}" ${draft.tableId===t.id?'selected':''}>${esc(t.name)}${t.occupied?' • ocupada':''}</option>`).join(''):'');return `<div class="comanda-shell"><div class="comanda-head"><div class="store">${staffSession.logo_url?`<img class="store-logo" src="${esc(staffSession.logo_url)}">`:`<div class="brandmark">PC</div>`}<div><h2 style="margin:0">${esc(staffSession.business_name)}</h2><small>Pede Comanda • atendimento</small></div></div></div><div class="comanda-body"><div class="triplet"><div class="mini"><span>Mesa / Retirada</span><select id="staffTable" onchange="draft.tableId=this.value" style="border:0;background:transparent;width:100%;font-weight:900;color:var(--wine)">${options}</select></div><div class="mini"><span>Atendente</span><b>${esc(staffSession.staff_name)}</b></div><div class="mini"><span>Atendimento</span><b>${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</b></div></div>${cats.map(c=>`<section class="menu-cat"><h3>${esc(c.name)}</h3>${(c.products||[]).map(staffMenuLine).join('')}</section>`).join('')}<div class="field"><label>Nome do cliente ${draft.tableId===''?'':'(opcional)'}</label><input value="${esc(draft.customer)}" oninput="draft.customer=this.value" placeholder="Ex.: João"></div><div class="field"><label>Observações do pedido</label><textarea rows="3" oninput="draft.notes=this.value" placeholder="Ex.: sem cebola, carne bem passada...">${esc(draft.notes)}</textarea></div><div class="summary"><div><span class="muted">Total</span><strong>${money(draftTotal())}</strong></div></div><button class="send" onclick="submitStaffOrder()">Enviar para Cozinha</button>${draft.tableId&&staffSession.role!=='kitchen'?`<button class="btn btn-danger btn-block" style="margin-top:9px" onclick="staffCloseCurrentTable()">Encerrar mesa / fechar conta</button>`:''}</div></div>`}
function allStaffProducts(){return (staffSession.categories||[]).flatMap(c=>c.products||[])}
function draftAddonUnit(p){const ids=draft.addons?.[p.id]||[];return (p.addons||[]).filter(a=>ids.includes(a.id)).reduce((s,a)=>s+Number(a.price||0),0)}
function draftTotal(){return allStaffProducts().reduce((a,p)=>a+(Number(p.price)+draftAddonUnit(p))*(draft.qty[p.id]||0),0)}
function addonChoiceBox(p,origin){if(!(p.addons||[]).length)return '';const ids=draft.addons?.[p.id]||[];return `<div class="addon-box"><div class="addon-title">Escolha os adicionais</div>${p.addons.map(a=>`<label class="addon-opt"><input type="checkbox" ${ids.includes(a.id)?'checked':''} onchange="toggleDraftAddon('${p.id}','${a.id}',this.checked,'${origin}')"><span>${esc(a.name)}</span><span class="addon-price">${Number(a.price)>0?'+'+money(a.price):'Grátis'}</span></label>`).join('')}</div>`}
function toggleDraftAddon(pid,aid,on,origin){draft.addons=draft.addons||{};const set=new Set(draft.addons[pid]||[]);on?set.add(aid):set.delete(aid);draft.addons[pid]=[...set];origin==='staff'?renderStaff():renderQR(new URL(location.href).searchParams.get('qr'))}
function staffMenuLine(p){const q=draft.qty[p.id]||0;const unit=Number(p.price)+draftAddonUnit(p);return `<div class="menu-row"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)}</div></div><div class="qty"><button onclick="staffQty('${p.id}',-1)">−</button><span>${q}</span><button onclick="staffQty('${p.id}',1)">+</button></div><div class="price">${money(unit*q)}</div>${addonChoiceBox(p,'staff')}</div>`}
function staffQty(id,d){draft.qty[id]=Math.max(0,(draft.qty[id]||0)+d);renderStaff()}
async function staffCloseCurrentTable(){
  if(!draft.tableId)return toast('Selecione uma mesa.');
  const t=(staffSession.tables||[]).find(x=>x.id===draft.tableId);
  const name=t?.name||'Mesa';
  if(!confirm(`Encerrar ${name}?\n\nIsso fecha a conta, marca os pedidos como entregues e libera a mesa para o próximo atendimento.`))return;
  try{
    const r=await rpc('pc_close_table_session_staff',{p_session_token:staffSession.session_token,p_table_id:draft.tableId},false);
    toast(`${name} encerrada • Total ${money(r.total)}`);
    await loadStaff();
  }catch(e){toast(e.message)}
}
async function submitStaffOrder(){const items=Object.entries(draft.qty).filter(([,q])=>q>0).map(([product_id,qty])=>({product_id,qty,addons:draft.addons?.[product_id]||[]}));if(!items.length)return toast('Selecione pelo menos um item.');if(draft.tableId===''&&!draft.customer.trim())return toast('Informe o nome do cliente para a retirada.');try{const r=await rpc('pc_place_staff_order',{p_session_token:staffSession.session_token,p_table_id:draft.tableId||null,p_items:items,p_notes:draft.notes||null,p_customer_name:draft.customer||null},false);const wpp=staffSession.kitchen_whatsapp;const currentTable=draft.tableId;draft={tableId:currentTable,qty:{},addons:{},notes:'',customer:''};toast(r.pickup_no?`Senha ${String(r.pickup_no).padStart(3,'0')} enviada para a cozinha.`:`Pedido #${r.order_no} enviado para a cozinha.`);if(wpp&&confirm('Pedido enviado. Deseja abrir uma cópia no WhatsApp da cozinha?')){const text=r.pickup_no?`NOVO PEDIDO - PEDE COMANDA\nSenha ${String(r.pickup_no).padStart(3,'0')}\nAtendente: ${staffSession.staff_name}\nTotal: ${money(r.total)}`:`NOVO PEDIDO - PEDE COMANDA\nPedido #${r.order_no}\nAtendente: ${staffSession.staff_name}\nTotal: ${money(r.total)}`;window.open(`https://wa.me/${wpp}?text=${encodeURIComponent(text)}`,'_blank')}view='kitchen';await loadStaffOrders(true)}catch(e){toast(e.message)}}
async function loadStaffOrders(show=true){try{staffSession.orders=await rpc('pc_staff_orders',{p_session_token:staffSession.session_token,p_limit:100},false);if(show)renderStaff()}catch(e){console.warn(e)}}
function staffKitchenView(){if(!staffSession.orders){loadStaffOrders(true);return '<div class="card empty">Carregando pedidos...</div>'}const sts=[['new','Novos'],['preparing','Em preparo'],['ready','Prontos'],['delivered','Entregues']];const rows=(staffSession.orders||[]).filter(o=>o.status===kitchenFilter);return `<div class="page-head"><div><h1>Cozinha</h1><div class="muted">Pedidos do estabelecimento.</div></div><button class="btn btn-soft" onclick="loadStaffOrders(true)">Atualizar</button></div><div class="status-tabs">${sts.map(([s,n])=>`<button class="${kitchenFilter===s?'active':''}" onclick="kitchenFilter='${s}';renderStaff()">${n} (${(staffSession.orders||[]).filter(o=>o.status===s).length})</button>`).join('')}</div><div class="orders-list">${rows.map(orderCardStaff).join('')||'<div class="card empty">Nenhum pedido neste status.</div>'}</div>`}
function orderCardStaff(o){const next={new:['Iniciar preparo','preparing'],preparing:['Marcar pronto','ready'],ready:['Entregar','delivered']}[o.status];const main=o.channel==='counter'?`SENHA ${String(o.pickup_no||0).padStart(3,'0')} • Balcão`:`#${o.order_no} • ${o.table_name}`;return `<article class="order-card"><div class="top"><div><b>${esc(main)}</b><div class="muted">${fmtTime(o.created_at)} • ${esc(o.staff_name)}</div></div>${badge(o.status)}</div><ul>${(o.items||[]).map(i=>`<li>${i.qty}x ${esc(i.name)}${addonText(i.addons)}</li>`).join('')}</ul>${['qr','counter'].includes(o.channel)&&(o.customer_name||o.customer_whatsapp)?`<div class="muted"><b>Cliente:</b> ${esc(o.customer_name||'Não informado')}${o.customer_whatsapp?` • WhatsApp ${esc(o.customer_whatsapp)}`:''}</div>`:''}${o.notes?`<div class="muted"><b>Obs.:</b> ${esc(o.notes)}</div>`:''}<div class="inline" style="justify-content:space-between;margin-top:10px"><b>${money(o.total)}</b>${next?`<button class="btn btn-primary btn-sm" onclick="staffStatus('${o.id}','${next[1]}')">${next[0]}</button>`:''}</div></article>`}
async function staffStatus(id,status){try{await rpc('pc_update_order_status',{p_session_token:staffSession.session_token,p_order_id:id,p_status:status},false);await loadStaffOrders(true)}catch(e){toast(e.message)}}
function logoutStaff(){clearPoll();staffSession=null;localStorage.removeItem('pc_staff');renderAuth('staff')}

async function loadQR(token){clearPoll();appMode='qr';try{const boot=await rpc('pc_qr_bootstrap',{p_qr_token:token},false);staffSession=boot;setTheme(boot.theme_color);draft={tableId:boot.table_id,qty:{},addons:{},notes:'',customer:'',whatsapp:''};renderQR(token)}catch(e){document.getElementById('app').innerHTML=`<div class="onboard"><div class="card"><h2>QR inválido</h2><p>${esc(e.message)}</p></div></div>`}}
function renderQR(token){const cats=staffSession.categories||[];document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand">${staffSession.logo_url?`<img class="logo-mini" src="${esc(staffSession.logo_url)}">`:`<div class="brandmark">PC</div>`}<div class="brandtxt"><strong>${esc(staffSession.business_name)}</strong><small>Pede Comanda • ${esc(staffSession.table_name)}</small></div></div></header><main class="main"><div class="comanda-shell"><div class="comanda-head"><div class="store"><div><h2 style="margin:0">Pedido pela Mesa</h2><small>${esc(staffSession.table_name)} • monte sua comanda</small></div></div></div><div class="comanda-body">${cats.map(c=>`<section class="menu-cat"><h3>${esc(c.name)}</h3>${(c.products||[]).map(qrMenuLine).join('')}</section>`).join('')}<div class="field"><label>Seu nome</label><input value="${esc(draft.customer)}" oninput="draft.customer=this.value" placeholder="Ex.: João"><div class="muted small">Só para identificar o pedido na mesa.</div></div><div class="field"><label>WhatsApp (opcional)</label><input inputmode="tel" value="${esc(draft.whatsapp||'')}" oninput="draft.whatsapp=this.value" placeholder="(21) 99999-9999"><div class="muted small">Não cria cadastro. É apenas um contato deste pedido.</div></div><div class="field"><label>Observações</label><textarea rows="3" oninput="draft.notes=this.value" placeholder="Ex.: sem cebola...">${esc(draft.notes)}</textarea></div><div class="summary"><div><span class="muted">Total</span><strong>${money(qrTotal())}</strong></div></div><button class="send" onclick="submitQROrder('${token}')">Enviar pedido para a cozinha</button></div></div></main>`}
function qrProducts(){return (staffSession.categories||[]).flatMap(c=>c.products||[])}
function qrTotal(){return qrProducts().reduce((a,p)=>a+(Number(p.price)+draftAddonUnit(p))*(draft.qty[p.id]||0),0)}
function qrMenuLine(p){const q=draft.qty[p.id]||0;const unit=Number(p.price)+draftAddonUnit(p);return `<div class="menu-row"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)}</div></div><div class="qty"><button onclick="qrQty('${p.id}',-1)">−</button><span>${q}</span><button onclick="qrQty('${p.id}',1)">+</button></div><div class="price">${money(unit*q)}</div>${addonChoiceBox(p,'qr')}</div>`}
function qrQty(id,d){draft.qty[id]=Math.max(0,(draft.qty[id]||0)+d);renderQR(new URL(location.href).searchParams.get('qr'))}
async function submitQROrder(token){const items=Object.entries(draft.qty).filter(([,q])=>q>0).map(([product_id,qty])=>({product_id,qty,addons:draft.addons?.[product_id]||[]}));if(!items.length)return toast('Selecione pelo menos um item.');try{const r=await rpc('pc_place_qr_order_v2',{p_qr_token:token,p_items:items,p_notes:draft.notes||null,p_customer_name:draft.customer||null,p_customer_whatsapp:normalizeCustomerPhone(draft.whatsapp)||null,p_table_session_token:staffSession.table_session_token||null,p_session_epoch:staffSession.session_epoch},false);staffSession.table_session_token=r.table_session_token;staffSession.session_epoch=r.session_epoch;draft={tableId:staffSession.table_id,qty:{},addons:{},notes:'',customer:'',whatsapp:''};document.getElementById('app').innerHTML=`<div class="onboard"><div class="card" style="text-align:center"><div style="font-size:52px">✅</div><h1>Pedido enviado!</h1><p>Pedido <b>#${r.order_no}</b> recebido pela cozinha.</p><h2>${money(r.total)}</h2><button class="btn btn-primary" onclick="renderQR('${token}')">Fazer outro pedido</button></div></div>`}catch(e){toast(e.message)}}
function clearPoll(){if(poller){clearInterval(poller);poller=null}}
init();
</script>
</body></html>
