<style>

olor:#14764a}.b-done{background:#ece9e8;color:#625b58}.b-cancel{background:#ffe5e8;color:#aa2637}.empty{padding:24px;text-align:center;color:var(--muted)}

ding:10px;background:#faf6f5;border:1px solid var(--line);border-radius:10px}.config-title{font-size:11px;font-weight:900;color:var(--wine);margin:5px 0;text-transform:uppercase}.variant-opt{display:flex;align-items:center;gap:7px;font-size:12px;padding:4px 0}.variant-opt input{accent-color:var(--wine)}.mount-btn{border:0;border-radius:9px;padding:8px 10px;background:#f6e3e7;color:var(--wine);font-weight:900}.draft-cart{margin:12px 0;border:1px solid var(--line);border-radius:13px;overflow:hidden}.draft-cart h4{margin:0;padding:9px 11px;background:#f8efed;color:var(--wine)}.draft-cart-line{display:flex;justify-content:space-between;gap:8px;padding:9px 11px;border-top:1px solid var(--line)}.draft-cart-detail{font-size:12px;color:var(--muted);margin-top:2px}.qty{display:flex;align-items:center;justify-content:center;gap:6px}.qty button{width:31px;height:31px;border:0;border-radius:8px;background:#f6e3e7;color:var(--wine);font-size:18px;font-weight:900}.qty span{min-width:20px;text-align:center;font-weight:900}.price{text-align:right;font-weight:900}.summary{display:flex;justify-content:space-between;align-items:end;border-top:1px dashed #dbc9c5;padding-top:11px;margin-top:11px}.summary strong{font-size:29px;color:var(--wine);display:block}.send{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--wine),var(--wine2));color:white;font-size:16px;font-weight:900;margin-top:11px}

{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Ajuste mobile compacto - Pede Comanda */
@media(max-width:900px){
  html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
  body{position:relative}
  #app,.layout,.main{width:100%;max-width:100vw;min-width:0;overflow-x:hidden}
  .topbar{width:100%;max-width:100vw;padding:8px 10px;gap:8px}
  .brand{gap:8px;min-width:0;flex:1;overflow:hidden}
  .logo-mini,.brandmark{width:38px;height:38px;border-radius:10px;flex:0 0 38px}
  .brandtxt{min-width:0;overflow:hidden}
  .brandtxt strong{font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .toolbar{flex:0 0 auto}
  .topbar .btn{padding:8px 11px;font-size:14px;border-radius:10px;white-space:nowrap}
  .layout{grid-template-columns:minmax(0,1fr)}
  .main{padding:12px 10px 78px;margin:0}
  .page-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:9px;margin-bottom:12px;min-width:0;width:100%;max-width:100%}
  .page-head>div{flex:1 1 220px;min-width:0;max-width:100%}
  .page-head>.btn{flex:0 0 auto;margin-left:auto;padding:8px 10px;font-size:13px;white-space:nowrap;max-width:44%}
  .page-head h1{font-size:24px;line-height:1.08;overflow-wrap:anywhere}
  .page-head h2{font-size:20px;line-height:1.1}
  .page-head .muted{font-size:14px;line-height:1.28;margin-top:4px}
  .grid{gap:10px;width:100%;max-width:100%;min-width:0}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3,.grid-2{grid-template-columns:1fr}
  .card{width:100%;max-width:100%;min-width:0;border-radius:15px;padding:13px;box-shadow:0 7px 22px rgba(72,10,20,.08);overflow:hidden}
  .stat{min-height:94px}
  .stat span{font-size:12px;line-height:1.2}
  .stat b{font-size:22px;line-height:1.05;margin-top:6px;overflow-wrap:anywhere}
  .table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table{min-width:620px}
  .table th,.table td{padding:9px 8px;font-size:12px}
  .table th{font-size:10px}
  .orders-list{gap:9px}
  .order-card{padding:11px;border-radius:13px;min-width:0}
  .status-tabs{margin-bottom:9px;max-width:100%;overflow-x:auto}
  .status-tabs button{padding:7px 9px;font-size:12px}
  .mobile-nav{padding:4px 3px calc(4px + env(safe-area-inset-bottom));width:100%;max-width:100vw;overflow:hidden}
  .mobile-nav button{font-size:9px;padding:4px 2px;min-width:0;flex:1}
  .toolbar{gap:6px;min-width:0}
  .btn{padding:9px 11px;border-radius:10px}
  .btn-sm{padding:6px 8px;font-size:12px}
  .toast{left:10px;right:10px;bottom:72px;max-width:none}
}
@media(max-width:430px){
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .table-session-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page-head>.btn{max-width:100%;margin-left:0}
}

/* Trial / onboarding */
.trial-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-radius:15px;margin-bottom:14px;background:#fff4d8;border:1px solid #f0d38a;color:#6e4a00}
.trial-banner.expired{background:#fff0f2;border-color:#efb4bd;color:#8f1020}.trial-banner b{display:block;margin-bottom:2px}.trial-banner .btn{flex:0 0 auto}
.onboarding-guide{margin-bottom:14px}.onboarding-progress{height:8px;background:#eee5e2;border-radius:999px;overflow:hidden;margin:10px 0 14px}.onboarding-progress>span{display:block;height:100%;background:var(--wine);border-radius:999px}
.onboarding-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.onboarding-step{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;min-height:90px}.onboarding-step.done{background:#f0fbf5;border-color:#bfe7d0}.onboarding-step b{display:block;font-size:13px;margin:4px 0}.onboarding-step small{color:var(--muted)}.onboarding-step button{margin-top:7px}
.trial-pill{display:inline-flex;align-items:center;gap:6px;background:#fff4d8;color:#7a5200;border:1px solid #efd69a;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;margin-bottom:12px}
@media(max-width:900px){.onboarding-list{grid-template-columns:1fr 1fr}.trial-banner{align-items:flex-start;flex-direction:column}.trial-banner .btn{width:100%}}
@media(max-width:520px){.onboarding-list{grid-template-columns:1fr}}


.plan-card{max-width:720px}.plan-price{font-size:42px;font-weight:1000;color:var(--wine);letter-spacing:-1px}.plan-price small{font-size:15px;color:var(--muted);font-weight:700}.plan-features{display:grid;gap:9px;margin:18px 0}.plan-feature{display:flex;gap:8px;align-items:flex-start}.plan-feature span{color:var(--ok);font-weight:1000}

/* Ajuda guiada / suporte */
.screen-help{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:#fff;border:1px solid #e8d7d3;border-left:4px solid var(--wine);border-radius:14px;padding:11px 13px;margin-bottom:14px;box-shadow:0 7px 20px rgba(72,10,20,.05)}
.screen-help .screen-help-text{min-width:0}.screen-help b{color:var(--wine)}.screen-help .btn{flex:0 0 auto}
.onboarding-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.help-fab{position:fixed;right:16px;bottom:18px;z-index:85;border:0;border-radius:999px;padding:12px 16px;background:linear-gradient(135deg,#126d3d,#159e59);color:#fff;font-weight:900;box-shadow:0 12px 30px rgba(12,91,49,.28);display:flex;align-items:center;gap:8px}
.help-fab:active{transform:scale(.98)}
.help-backdrop{position:fixed;inset:0;z-index:120;background:rgba(30,12,15,.58);display:grid;place-items:center;padding:16px;overflow:auto}
.help-modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 28px 80px rgba(0,0,0,.32)}
.help-head{padding:19px 20px;background:linear-gradient(135deg,var(--wine3),var(--wine));color:#fff;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.help-head h2{margin:0 0 4px}.help-close{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;width:38px;height:38px;font-size:20px}
.help-body{padding:18px 20px}.help-intro{background:#fbf3f1;border:1px solid #ecd9d5;border-radius:14px;padding:13px;margin-bottom:14px}
.help-steps{display:grid;gap:9px}.help-step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:13px;padding:10px 12px}.help-step-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#f6e3e7;color:var(--wine);font-weight:1000}.help-step b{display:block;margin-bottom:2px}.help-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.help-actions .btn{flex:1 1 180px}
.video-placeholder{border:1px dashed #cfb6ba;border-radius:13px;padding:12px;background:#fffafa;margin-top:14px}


/* Tutoriais em vídeo */

function onTutorialVideoError(video){
  if(!video||video.dataset.fallbackUsed==='1')return;
  const fallback=video.dataset.fallback;
  if(!fallback)return;
  video.dataset.fallbackUsed='1';
  video.src=fallback;
  video.load();
}
function closeTutorialVideo(){
  const d=document.getElementById('pcTutorialVideo');
  if(!d)return;
  const v=d.querySelector('video');
  if(v){try{v.pause()}catch(_){} v.removeAttribute('src');v.load()}
  d.remove();
}

function dashboardView(){const live=data.orders.filter(o=>!['delivered','cancelled'].includes(o.status));const done=data.orders.filter(o=>o.status==='delivered');const total=done.reduce((a,o)=>a+Number(o.total),0);return `${onboardingGuide()}<div class="page-head"><div><h1>Visão geral</h1><div class="muted">Acompanhe a operação do estabelecimento.</div></div><button class="btn btn-primary" onclick="openStaffLoginHint()">+ Atendimento</button></div><div class="grid grid-4"><div class="card stat"><span>Pedidos</span><b>${data.orders.length}</b></div><div class="card stat"><span>Em aberto</span><b>${live.length}</b></div><div class="card stat"><span>Faturamento entregue</span><b>${money(total)}</b></div><div class="card stat"><span>Ticket médio</span><b>${money(done.length?total/done.length:0)}</b></div></div>${tableSessionsPanel()}<div class="card" style="margin-top:14px"><div class="page-head"><div><h2>Últimos pedidos</h2><div class="muted">Atualização automática.</div></div><button class="btn btn-soft" onclick="refreshOrders()">Atualizar</button></div>${ordersTable(data.orders.slice(0,12))}</div>`}
function tableSessionsPanel(){
  if(!['tables','mixed'].includes(business?.service_mode||'tables'))return '';
  const occupied=(data.sessions||[]).length;
  const freeCount=Math.max(0,(data.tables||[]).length-occupied);
  const cards=(data.tables||[]).map(t=>{
    const s=(data.sessions||[]).find(x=>x.table_id===t.id);
    if(!s)return `<div class="table-session-card free"><div class="table-session-top"><b>${esc(t.name)}</b><span class="table-state free-state">LIVRE</span></div><div class="muted small">Pronta para novo atendimento</div></div>`;
    const os=(data.orders||[]).filter(o=>o.table_session_id===s.id&&o.status!=='cancelled');
    const total=os.reduce((a,o)=>a+Number(o.total||0),0);
    const people=[...new Set(os.map(o=>(o.customer_name||'').trim()).filter(Boolean))];
    const names=people.length?people.slice(0,3).join(', ')+(people.length>3?'…':''):'Clientes da mesa';
    return `<div class="table-session-card occupied"><div class="table-session-top"><b>${esc(t.name)}</b><span class="table-state occupied-state">OCUPADA</span></div><div class="small">${os.length} pedido${os.length===1?'':'s'} • <b>${money(total)}</b></div><div class="muted small table-customer">${esc(names)}</div><button class="btn btn-danger btn-sm btn-block" onclick="closeTableSession('${t.id}','${esc(t.name)}')">Encerrar mesa</button></div>`;
  }).join('');
  return `<div class="card table-session-panel" style="margin-top:14px"><div class="page-head"><div><h2 style="margin:0">Mesas agora</h2><div class="muted">${occupied} ocupada${occupied===1?'':'s'} • ${freeCount} livre${freeCount===1?'':'s'}</div></div><button class="btn btn-soft btn-sm" onclick="reloadAdminData().then(renderAdmin)">Atualizar</button></div><div class="table-session-grid">${cards}</div></div>`;
}
async function closeTableSession(tableId,tableName){
  if(!confirm(`Encerrar ${tableName}?\n\nIsso fecha a conta desta ocupação, marca os pedidos como entregues e libera a mesa para a próxima família.`))return;
  try{
    const r=await rpc('pc_close_table_session',{p_table_id:tableId});
    await reloadAdminData();
    renderAdmin();
    toast(`${tableName} encerrada • Total ${money(r.total)} • Mesa livre`);
  }catch(e){toast(e.message)}
}

function productRows(cid){const ps=data.products.filter(p=>p.category_id===cid);if(!ps.length)return '<div class="empty">Sem itens nessa categoria.</div>';return `<div class="table-wrap"><table class="table"><tbody>${ps.map(p=>{const ac=data.addons.filter(a=>a.product_id===p.id&&a.active).length;const vc=data.variants.filter(v=>v.product_id===p.id&&v.active).length;return `<tr><td><span class="pc-product-title">${p.image_url?`<img class="pc-product-thumb" src="${esc(p.image_url)}" alt="" loading="lazy" onerror="this.style.display=\'none\'">`:``}<b>${esc(p.name)}</b></span><div class="muted small">${vc?`${vc} opções/massas • `:''}${ac?`${ac} adicionais`:'Sem adicionais'}</div><button class="btn btn-danger btn-sm product-delete-visible" style="margin-top:7px" onclick="deleteProduct('${p.id}')">🗑 Excluir item</button></td><td>${money(p.price)}</td><td>${p.active?'<span class="badge b-ready">Ativo</span>':'<span class="badge b-done">Inativo</span>'}</td><td><div class="toolbar"><button class="btn btn-soft btn-sm" onclick="variantProductId='${p.id}';addonProductId=null;renderAdmin()">1. Massas/Opções</button><button class="btn btn-soft btn-sm" onclick="addonProductId='${p.id}';variantProductId=null;renderAdmin()">2. Adicionais</button><button class="btn btn-soft btn-sm" onclick="chooseProductImage('${p.id}')">🔎 Buscar imagem</button><button class="btn btn-secondary btn-sm" onclick="editProduct('${p.id}')">Editar</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function variantEditor(){

function addonEditor(){
  const p=data.products.find(x=>x.id===addonProductId);
  if(!p){addonProductId=null;return '';}
  const rows=data.addons.filter(a=>a.product_id===p.id);
  const sources=data.products.filter(x=>x.id!==p.id&&data.addons.some(a=>a.product_id===x.id));
  const copyBox=sources.length?`<div class="card" style="margin:12px 0;background:#fafafa"><div class="field" style="margin:0"><label>Copiar adicionais de outro item</label><div class="toolbar"><select id="addonCopySource_${p.id}" style="min-width:220px"><option value="">Escolha o item...</option>${sources.map(s=>`<option value="${s.id}">${esc(s.name)} (${data.addons.filter(a=>a.product_id===s.id).length})</option>`).join('')}</select><button class="btn btn-soft btn-sm" onclick="copyAddonsFromSelected('${p.id}')">📋 Copiar adicionais</button></div><div class="muted small" style="margin-top:6px">A cópia fica independente. Depois você pode editar, excluir ou acrescentar adicionais neste item sem alterar o produto original.</div></div></div>`:'';
  return `<div class="card addon-admin"><div class="page-head"><div><h2 style="margin:0">Adicionais de ${esc(p.name)}</h2><div class="muted">Esses adicionais valem para todas as opções/variações deste produto. Preço 0 = grátis; preço maior que 0 = adicional pago.</div></div><div class="toolbar"><button class="btn btn-primary btn-sm" onclick="newAddon('${p.id}')">+ Adicional</button>${rows.length?`<button class="btn btn-soft btn-sm" onclick="copyAddonsToNextProduct('${p.id}')">↧ Repetir no próximo item</button>`:''}<button class="btn btn-secondary btn-sm" onclick="addonProductId=null;renderAdmin()">Fechar</button></div></div>${copyBox}${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Adicional</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${Number(a.price)>0?money(a.price):'<span class="badge b-ready">Grátis</span>'}</td><td>${a.active?'<span class="badge b-ready">Ativo</span>':'<span class="badge b-done">Inativo</span>'}</td><td><div class="toolbar"><button class="btn btn-soft btn-sm" onclick="editAddon('${a.id}')">Editar</button><button class="btn btn-danger btn-sm" onclick="removeAddon('${a.id}')">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum adicional cadastrado para este produto.</div>'}</div>`;
}
async function copyAddonsBetweenProducts(sourceProductId,targetProductId){
  if(!sourceProductId||!targetProductId||sourceProductId===targetProductId)return;
  const source=data.products.find(x=>x.id===sourceProductId);
  const target=data.products.find(x=>x.id===targetProductId);
  const sourceAddons=data.addons.filter(a=>a.product_id===sourceProductId);
  if(!source||!target)return toast('Produto não encontrado.');
  if(!sourceAddons.length)return toast('O item escolhido não possui adicionais.');
  const existing=data.addons.filter(a=>a.product_id===targetProductId);
  if(existing.length&&!confirm(`"${target.name}" já possui ${existing.length} adicional(is). Deseja acrescentar também os adicionais de "${source.name}"?`))return;
  if(!confirm(`Copiar ${sourceAddons.length} adicional(is) de "${source.name}" para "${target.name}"?\n\nDepois você poderá editar ou excluir cada cópia separadamente.`))return;
  const base=existing.length*10;
  const payload=sourceAddons.map((a,i)=>({
    business_id:business.id,
    product_id:targetProductId,
    name:a.name,
    price:Number(a.price)||0,
    active:a.active!==false,
    sort_order:base+(i+1)*10
  }));
  try{
    await rest('pc_product_addons','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});
    await reloadAdminData();
    addonProductId=targetProductId;
    renderAdmin();
    toast(`${sourceAddons.length} adicional(is) copiado(s) para ${target.name}.`);
  }catch(e){toast(e.message)}
}
async function copyAddonsFromSelected(targetProductId){
  const el=document.getElementById('addonCopySource_'+targetProductId);
  const sourceId=el?.value;
  if(!sourceId)return toast('Escolha de qual item deseja copiar os adicionais.');
  await copyAddonsBetweenProducts(sourceId,targetProductId);
}
async function copyAddonsToNextProduct(sourceProductId){
  const source=data.products.find(x=>x.id===sourceProductId);
  if(!source)return;
  const sameCategory=data.products.filter(p=>p.category_id===source.category_id);
  const pos=sameCategory.findIndex(p=>p.id===sourceProductId);
  const next=sameCategory[pos+1];
  if(!next)return toast('Este é o último item da categoria. Use "Copiar adicionais" para escolher outro produto.');
  await copyAddonsBetweenProducts(sourceProductId,next.id);
}

async function editCategory(id){
  const c=data.categories.find(x=>x.id===id);if(!c)return;
  const name=prompt('Corrigir nome da categoria',c.name);if(name===null)return;
  const clean=name.trim();if(!clean)return toast('Informe o nome da categoria.');
  try{
    await rest('pc_categories',`id=eq.${id}&business_id=eq.${business.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({name:clean.toUpperCase()})});
    await reloadAdminData();renderAdmin();toast('Categoria atualizada.');
  }catch(e){toast(e.message)}

async function deleteCategory(id){
  const cat=data.categories.find(x=>x.id===id);if(!cat)return;
  const count=data.products.filter(p=>p.category_id===id).length;
  let msg='Excluir a categoria "'+cat.name+'"?';
  if(count){
    msg+='\n\nAtenção: esta categoria possui '+count+' item'+(count===1?'':'s')+'. Ao excluir a categoria, esses itens e seus adicionais/opções também serão excluídos.';
  }
  msg+='\n\nEsta ação não pode ser desfeita.';
  if(!confirm(msg))return;
  try{
    await rest('pc_categories','id=eq.'+id+'&business_id=eq.'+business.id,{method:'DELETE',headers:{Prefer:'return=minimal'}});
    addonProductId=null;variantProductId=null;
    await reloadAdminData();renderAdmin();toast('Categoria excluída.');
  }catch(e){toast(e.message)}
}

let pcMenuAIItems=[];
function openMenuAI(){
 document.getElementById('pcMenuAI')?.remove();
 const el=document.createElement('div');el.id='pcMenuAI';
 el.style.cssText='position:fixed;inset:0;background:#0009;z-index:99999;overflow:auto;padding:16px';
 el.innerHTML='<div style="max-width:780px;margin:24px auto;background:white;color:#222;border-radius:16px;padding:20px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>📷 Importar cardápio com IA</h2><button class="btn btn-secondary" onclick="document.getElementById(\'pcMenuAI\').remove()">Fechar</button></div><p>Fotografe o cardápio impresso ou selecione até 6 imagens. Confira nomes e preços antes de cadastrar.</p><input id="pcMenuAIFile" type="file" accept="image/*" multiple style="width:100%;margin:12px 0"><button class="btn btn-primary" onclick="readMenuAI()">✨ Ler cardápio</button><div id="pcMenuAIStatus" class="muted" style="margin:12px 0"></div><div id="pcMenuAIReview"></div></div>';
 document.body.appendChild(el);pcMenuAIItems=[];
}
async function pcMenuImage(file){
 return new Promise((resolve,reject)=>{
  const im=new Image(),url=URL.createObjectURL(file);
  im.onload=()=>{
   const scale=Math.min(1,1800/Math.max(im.width,im.height));
   const canvas=document.createElement('canvas');canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);
   canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);
   URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.82));
  };im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Imagem inválida'))};im.src=url;
 });
}
async function readMenuAI(){
 const files=[...(document.getElementById('pcMenuAIFile')?.files||[])],status=document.getElementById('pcMenuAIStatus');
 if(!files.length||files.length>6){toast('Selecione de 1 a 6 imagens.');return}
 status.textContent='Lendo cardápio com IA. Aguarde...';
 try{
  const images=await Promise.all(files.map(pcMenuImage));
  const res=await fetch(SUPABASE_URL+'/functions/v1/pc-menu-ai-import',{method:'POST',headers:headers(),body:JSON.stringify({business_id:business.id,images})});
  const payload=await res.json();if(!res.ok)throw Error(payload.error||'Erro na leitura');
  pcMenuAIItems=(payload.items||[]).map(x=>({...x,selected:true}));
  status.textContent=pcMenuAIItems.length+' itens encontrados. Revise antes de importar.';
  renderMenuAIReview();
 }catch(e){status.textContent=e.message||'Erro na leitura';toast(status.textContent)}
}
function renderMenuAIReview(){
 const el=document.getElementById('pcMenuAIReview');if(!el)return;
 if(!pcMenuAIItems.length){el.innerHTML='<p>Nenhum produto identificado. Tente uma foto mais nítida.</p>';return}
 el.innerHTML='<p><b>Revisão dos produtos</b> — desmarque itens que não deseja importar.</p>'+pcMenuAIItems.map((x,i)=>'<div style="display:grid;grid-template-columns:28px 1fr 110px;gap:6px;margin:9px 0;align-items:center"><input type="checkbox" '+(x.selected?'checked':'')+' onchange="pcMenuAIItems['+i+'].selected=this.checked"><input aria-label="Nome do produto" value="'+esc(x.name)+'" onchange="pcMenuAIItems['+i+'].name=this.value" style="min-width:0;padding:9px;border:1px solid #ccc;border-radius:8px"><input aria-label="Preço" type="number" step="0.01" min="0" value="'+x.price+'" onchange="pcMenuAIItems['+i+'].price=Number(this.value)" style="width:100%;padding:9px;border:1px solid #ccc;border-radius:8px"><input aria-label="Categoria" value="'+esc(x.category)+'" onchange="pcMenuAIItems['+i+'].category=this.value" style="grid-column:2/4;padding:8px;border:1px solid #ddd;border-radius:8px"></div>').join('')+'<button class="btn btn-primary" onclick="importMenuAI()">✓ Confirmar e cadastrar produtos</button>';
}
async function importMenuAI(){
 const selected=pcMenuAIItems.filter(x=>x.selected&&x.name.trim()&&Number.isFinite(x.price)&&x.price>=0);
 if(!selected.length){toast('Nenhum item selecionado.');return}
 if(!confirm('Cadastrar '+selected.length+' produtos na loja '+business.name+'?'))return;
 const status=document.getElementById('pcMenuAIStatus');status.textContent='Cadastrando produtos...';
 let added=0,skipped=0;
 try{
  for(const item of selected){
   const categoryName=item.category.trim()||'Outros';
   let cat=data.categories.find(c=>c.name.toLocaleLowerCase('pt-BR')===categoryName.toLocaleLowerCase('pt-BR'));
   if(!cat){
    const created=await rest('pc_categories','',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({business_id:business.id,name:categoryName,sort_order:data.categories.length*10+10})});
    cat=created[0];data.categories.push(cat);
   }
   if(data.products.some(p=>p.category_id===cat.id&&p.name.toLocaleLowerCase('pt-BR')===item.name.trim().toLocaleLowerCase('pt-BR'))){skipped++;continue}
   const created=await rest('pc_products','',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({business_id:business.id,category_id:cat.id,name:item.name.trim(),description:String(item.description||"").trim(),price:item.price,sort_order:data.products.filter(p=>p.category_id===cat.id).length*10+10})});
   data.products.push(created[0]);added++;
  }
  document.getElementById('pcMenuAI')?.remove();await reloadAdminData();renderAdmin();toast(added+' produtos cadastrados. '+skipped+' duplicados ignorados.');
 }catch(e){status.textContent='Importação parcial: '+added+' cadastrados. '+e.message;toast(status.textContent)}
}

 document.body.appendChild(overlay);

 async function search(){
  const query=$('pc-img-query').value.trim();if(!query){$('pc-img-status').textContent='Digite o nome do alimento e toque em Buscar.';return;}

function pixField(id,value){value=String(value);return id+String(value.length).padStart(2,'0')+value}
function pixCrc16(value){let crc=0xFFFF;for(let i=0;i<value.length;i++){crc^=value.charCodeAt(i)<<8;for(let j=0;j<8;j++){crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xFFFF}}return crc.toString(16).toUpperCase().padStart(4,'0')}
function pixPayload(amount){
  const account=pixField('00','BR.GOV.BCB.PIX')+pixField('01',PIX_PAYMENT_KEY);
  const extra=pixField('05','***');
  let payload=pixField('00','01')+pixField('01','11')+pixField('26',account)+pixField('52','0000')+pixField('53','986')+pixField('54',Number(amount).toFixed(2))+pixField('58','BR')+pixField('59','PEDE COMANDA')+pixField('60','RIO DE JANEIRO')+pixField('62',extra)+'6304';
  return payload+pixCrc16(payload);
}
async function copyPaymentText(value,message){try{await navigator.clipboard.writeText(String(value));toast(message||'Copiado.')}catch(_){const t=document.createElement('textarea');t.value=String(value);document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast(message||'Copiado.')}}

function sendPixReceipt(){const p=PIX_PLANS[selectedPixPlan];const msg='Olá! Já fiz o pagamento do Pede Comanda. Estabelecimento: '+(business?.name||'')+'. Plano: '+p.label+' - '+money(p.amount)+'. Vou enviar o comprovante.';window.open('https://wa.me/'+SUPPORT_WHATSAPP+'?text='+encodeURIComponent(msg),'_blank')}
function pixAscii(value,maxLen){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 .\-]/g,'').toUpperCase().trim().slice(0,maxLen)}
function storePixPayload(amount){
  const key=String(staffSession?.customer_pix_key||'').trim();
  if(!key)return '';
  const merchant=pixAscii(staffSession?.business_name||'LOJA',25)||'LOJA';
  const city=pixAscii(staffSession?.customer_pix_city||'RIO DE JANEIRO',15)||'RIO DE JANEIRO';
  const account=pixField('00','BR.GOV.BCB.PIX')+pixField('01',key);
  const extra=pixField('05','***');
  let payload=pixField('00','01')+pixField('01','11')+pixField('26',account)+pixField('52','0000')+pixField('53','986')+pixField('54',Number(amount).toFixed(2))+pixField('58','BR')+pixField('59',merchant)+pixField('60',city)+pixField('62',extra)+'6304';
  return payload+pixCrc16(payload);
}

}

async function loadQR(token){clearPoll();appMode='qr';try{const boot=await rpc('pc_qr_bootstrap',{p_qr_token:token},false);staffSession=boot;applyComandaAppearance(boot);draft={tableId:boot.table_id,qty:{},addons:{},lines:[],config:{},notes:'',customer:'',whatsapp:''};renderQR(token)}catch(e){document.getElementById('app').innerHTML=`<div class="onboard"><div class="card"><h2>QR inválido</h2><p>${esc(e.message)}</p></div></div>`}}
function renderQR(token){applyComandaAppearance(staffSession);const cats=staffSession.categories||[];document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand">${staffSession.logo_url?`<img class="logo-mini" src="${esc(staffSession.logo_url)}">`:`<div class="brandmark">PC</div>`}<div class="brandtxt"><strong>${esc(staffSession.business_name)}</strong><small>Pede Comanda • ${esc(staffSession.table_name)}</small></div></div></header><main class="main"><div class="comanda-shell customer-comanda">${comandaCoverHtml(staffSession)}<div class="comanda-head"><div class="store"><div><h2 style="margin:0">Pedido pela Mesa</h2><small>${esc(staffSession.table_name)} • monte sua comanda</small></div></div></div><div class="comanda-body">${cats.map(c=>`<section class="menu-cat"><h3>${esc(c.name)}</h3>${(c.products||[]).map(qrMenuLine).join('')}</section>`).join('')}${draftCart('qr')}<div class="field"><label>Seu nome</label><input value="${esc(draft.customer)}" oninput="draft.customer=this.value" placeholder="Ex.: João"><div class="muted small">Só para identificar o pedido na mesa.</div></div><div class="field"><label>WhatsApp (opcional)</label><input inputmode="tel" value="${esc(draft.whatsapp||'')}" oninput="draft.whatsapp=this.value" placeholder="(21) 99999-9999"><div class="muted small">Não cria cadastro. É apenas um contato deste pedido.</div></div><div class="field"><label>Observações</label><textarea rows="3" oninput="draft.notes=this.value" placeholder="Ex.: sem cebola...">${esc(draft.notes)}</textarea></div><div class="summary"><div><span class="muted">Total</span><strong>${money(qrTotal())}</strong></div></div><button class="send" onclick="submitQROrder('${token}')">Enviar pedido para a cozinha</button></div></div></main>`}
function qrProducts(){return (staffSession.categories||[]).flatMap(c=>c.products||[])}
function qrTotal(){const simple=qrProducts().reduce((a,p)=>a+(draftIsCustom(p)?0:Number(p.price)*(draft.qty[p.id]||0)),0);return simple+(draft.lines||[]).reduce((s,l)=>s+draftLineTotal(l),0)}
function qrMenuLine(p){
  if(draftIsCustom(p)){const count=(draft.lines||[]).filter(l=>l.product_id===p.id).reduce((s,l)=>s+Math.max(1,Number(l.qty||1)),0);return `<div class="menu-row"><div><span class="pc-product-title">${p.image_url?`<img class="pc-product-thumb" src="${esc(p.image_url)}" alt="" loading="lazy" onerror="this.style.display=\'none\'">`:``}<b>${esc(p.name)}</b></span><div class="muted">A partir de ${money(p.price)}</div>${p.description?`<div class="muted small pc-item-description">${esc(p.description)}</div>`:""}<div class="muted small">${count?count+' montado(s) no pedido':'Escolha massa/opção e adicionais'}</div></div><div><button class="mount-btn" onclick="draftOpenConfig('${p.id}','qr')">Escolher opções</button></div><div class="price">${count?money((draft.lines||[]).filter(l=>l.product_id===p.id).reduce((s,l)=>s+draftLineTotal(l),0)):'—'}</div>${draftConfigBox(p,'qr')}</div>`}
  const q=draft.qty[p.id]||0;return `<div class="menu-row"><div><span class="pc-product-title">${p.image_url?`<img class="pc-product-thumb" src="${esc(p.image_url)}" alt="" loading="lazy" onerror="this.style.display=\'none\'">`:``}<b>${esc(p.name)}</b></span><div class="muted">${money(p.price)}</div>${p.description?`<div class="muted small pc-item-description">${esc(p.description)}</div>`:""}</div><div class="qty"><button onclick="qrQty('${p.id}',-1)">−</button><span>${q}</span><button onclick="qrQty('${p.id}',1)">+</button></div><div class="price">${q>0?money(Number(p.price)*q):""}</div></div>`
}
function qrQty(id,d){draft.qty[id]=Math.max(0,(draft.qty[id]||0)+d);renderQR(new URL(location.href).searchParams.get('qr'))}
async function submitQROrder(token){const items=Object.entries(draft.qty).filter(([,q])=>q>0).map(([product_id,qty])=>({product_id,qty,addons:[],variant_id:null})).concat((draft.lines||[]).map(l=>({product_id:l.product_id,qty:Math.max(1,Number(l.qty||1)),addons:l.addons||[],variant_id:l.variant_id||null})));if(!items.length)return toast('Selecione pelo menos um item.');try{const r=await rpc('pc_place_qr_order_v2',{p_qr_token:token,p_items:items,p_notes:draft.notes||null,p_customer_name:draft.customer||null,p_customer_whatsapp:(String(draft.whatsapp||'').replace(/\D/g,'')?((String(draft.whatsapp||'').replace(/\D/g,'').length===10||String(draft.whatsapp||'').replace(/\D/g,'').length===11)&&!String(draft.whatsapp||'').replace(/\D/g,'').startsWith('55')?'55'+String(draft.whatsapp||'').replace(/\D/g,''):String(draft.whatsapp||'').replace(/\D/g,'')):null),p_table_session_token:staffSession.table_session_token||null,p_session_epoch:staffSession.session_epoch},false);staffSession.table_session_token=r.table_session_token;staffSession.session_epoch=r.session_epoch;draft={tableId:staffSession.table_id,qty:{},addons:{},lines:[],config:{},notes:'',customer:'',whatsapp:''};document.getElementById('app').innerHTML=`<div class="onboard"><div class="card" style="text-align:center"><div style="font-size:52px">✅</div><h1>Pedido enviado!</h1><p>Pedido <b>#${r.order_no}</b> recebido pela cozinha.</p><h2>${money(r.total)}</h2>${customerPaymentHtml(r.order_no,r.total,null)}<div style="display:grid;gap:10px;max-width:320px;margin:0 auto"><button class="btn btn-primary" onclick="renderQR('${token}')">Fazer outro pedido</button><button class="btn btn-soft" onclick="location.href='/'">Sair</button></div></div></div>`}catch(e){toast(e.message)}}
function clearPoll(){if(poller){clearInterval(poller);poller=null}}
(function bootPedeComanda(){
  const start=()=>init().catch(e=>{console.error(e);try{localStorage.removeItem('pc_auth');localStorage.removeItem('pc_staff')}catch(_){}document.getElementById('app').innerHTML='<div class="onboard"><div class="card"><h2>Não foi possível abrir o sistema</h2><p>'+esc(e?.message||'Erro ao carregar.')+'</p><button class="btn btn-primary" onclick="location.reload()">Tentar novamente</button></div></div>'});
  const s=document.createElement('script');
  s.src='/sistema/delivery.js?v=20261008-4';
  s.onload=start;
  s.onerror=()=>{console.warn('Delivery patch não carregou');start()};
  document.head.appendChild(s);
})();
</script>
</body></html>
