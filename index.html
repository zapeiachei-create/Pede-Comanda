<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b0f1b">
<title>Pede Comanda</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f3f1}
#comandaFrame{display:block;width:100%;height:100%;border:0;background:#f7f3f1}
</style>
</head>
<body>
<iframe id="comandaFrame" title="Pede Comanda"></iframe>
<script>
const frame=document.getElementById('comandaFrame');
frame.src='legacy/index.html'+location.search;

function widgetCss(){
return `
.pc-lead-cta{margin-top:18px;padding:15px 13px;border:1px solid #ead4d9;background:linear-gradient(180deg,#fff9fa,#fff);border-radius:15px;text-align:center}
.pc-lead-badge{width:42px;height:42px;margin:0 auto 8px;border-radius:13px;background:linear-gradient(135deg,#4d0710,var(--wine,#7b0f1b));color:#fff;display:grid;place-items:center;font-weight:1000;box-shadow:0 8px 20px #5b0b1830}
.pc-lead-cta h3{margin:0 0 4px;font-size:16px;color:var(--wine,#7b0f1b)}
.pc-lead-cta p{margin:0 0 11px;font-size:13px;line-height:1.35;color:#746b6b}
.pc-lead-btn{width:100%;border:1px solid #d9aeb7;border-radius:12px;padding:12px 13px;background:#fff;color:var(--wine,#7b0f1b);font-weight:900}
.pc-lead-modal{position:fixed;inset:0;z-index:9999;background:#24020899;display:grid;place-items:center;padding:16px;overflow:auto}
.pc-lead-modal.pc-hidden{display:none}
.pc-lead-card{position:relative;width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 28px 80px #24020855}
.pc-lead-close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;border-radius:50%;background:#f6e6e9;color:var(--wine,#7b0f1b);font-size:21px;font-weight:900}
.pc-lead-card h2{margin:2px 42px 5px 0;color:var(--wine,#7b0f1b);font-size:22px}
.pc-lead-sub{margin:0 0 15px;color:#746b6b;font-size:13px;line-height:1.4}
.pc-field{display:grid;gap:6px;margin-bottom:12px}
.pc-field label{font-size:13px;font-weight:800;color:#594d4d}
.pc-field input,.pc-field select{width:100%;box-sizing:border-box;border:1px solid #dfd1cd;border-radius:11px;background:#fff;padding:11px 12px;outline:0;font:inherit}
.pc-field input:focus,.pc-field select:focus{border-color:var(--wine,#7b0f1b);box-shadow:0 0 0 3px #f5d8de}
.pc-lead-send{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,#1e9c50,#16823f);color:#fff;font-weight:900;font-size:15px}
.pc-lead-note{text-align:center;color:#746b6b;font-size:11px;margin:9px 0 0}
`;
}

function widgetHtml(){
return '<div class="pc-lead-cta" id="pcLeadCta">'+
'<div class="pc-lead-badge">PC</div>'+
'<h3>Gostou dessa comanda?</h3>'+
'<p>Tenha o <b>Pede Comanda</b> também no seu restaurante, lanchonete ou negócio.</p>'+
'<button class="pc-lead-btn" id="pcOpenLead">Quero uma comanda para meu negócio</button>'+
'</div>';
}

function modalHtml(){
return '<div id="pcLeadModal" class="pc-lead-modal pc-hidden">'+
'<div class="pc-lead-card">'+
'<button class="pc-lead-close" id="pcCloseLead" aria-label="Fechar">×</button>'+
'<h2>Quero o Pede Comanda</h2>'+
'<p class="pc-lead-sub">Preencha rapidinho. Ao finalizar, sua mensagem será enviada pelo WhatsApp.</p>'+
'<div class="pc-field"><label>Seu nome *</label><input id="pcLeadName" placeholder="Ex.: João da Silva"></div>'+
'<div class="pc-field"><label>Nome do estabelecimento *</label><input id="pcLeadBusiness" placeholder="Ex.: Lanchonete do João"></div>'+
'<div class="pc-field"><label>Seu WhatsApp *</label><input id="pcLeadPhone" inputmode="tel" placeholder="(21) 99999-9999"></div>'+
'<div class="pc-field"><label>Tipo de negócio</label><select id="pcLeadType"><option>Restaurante</option><option>Lanchonete</option><option>Trailer / Food Truck</option><option>Bar / Petiscaria</option><option>Pastelaria</option><option>Pizzaria</option><option>Outro</option></select></div>'+
'<div class="pc-field"><label>Cidade</label><input id="pcLeadCity" placeholder="Ex.: Nova Iguaçu"></div>'+
'<div class="pc-field"><label>Quantas mesas aproximadamente?</label><select id="pcLeadTables"><option>Sem mesas / Retirada</option><option>1 a 10</option><option>11 a 30</option><option>31 a 50</option><option>Mais de 50</option></select></div>'+
'<button class="pc-lead-send" id="pcSendLead">QUERO MINHA COMANDA</button>'+
'<p class="pc-lead-note">Você será direcionado para o WhatsApp do Pede Comanda.</p>'+
'</div></div>';
}

function injectWidget(){
 const d=frame.contentDocument;
 if(!d||!d.body)return;
 if(!d.getElementById('pcLeadStyles')){
   const s=d.createElement('style'); s.id='pcLeadStyles'; s.textContent=widgetCss(); d.head.appendChild(s);
 }
 let target=d.querySelector('.sheet .body');
 if(!target){
   const success=[...d.querySelectorAll('main .card')].find(el=>(el.textContent||'').includes('Pedido enviado!'));
   if(success) target=success;
 }
 if(!target)return;
 if(!d.getElementById('pcLeadCta')) target.insertAdjacentHTML('beforeend',widgetHtml());
 if(!d.getElementById('pcLeadModal')) d.body.insertAdjacentHTML('beforeend',modalHtml());

 const modal=d.getElementById('pcLeadModal');
 const open=d.getElementById('pcOpenLead');
 const close=d.getElementById('pcCloseLead');
 const send=d.getElementById('pcSendLead');

 if(open&&!open.dataset.bound){
   open.dataset.bound='1';
   open.addEventListener('click',()=>{modal.classList.remove('pc-hidden');d.body.style.overflow='hidden';setTimeout(()=>d.getElementById('pcLeadName')?.focus(),80)});
 }
 if(close&&!close.dataset.bound){
   close.dataset.bound='1';
   close.addEventListener('click',()=>{modal.classList.add('pc-hidden');d.body.style.overflow=''});
 }
 if(modal&&!modal.dataset.bound){
   modal.dataset.bound='1';
   modal.addEventListener('click',e=>{if(e.target===modal){modal.classList.add('pc-hidden');d.body.style.overflow=''}});
 }
 if(send&&!send.dataset.bound){
   send.dataset.bound='1';
   send.addEventListener('click',()=>{
     const name=(d.getElementById('pcLeadName')?.value||'').trim();
     const establishment=(d.getElementById('pcLeadBusiness')?.value||'').trim();
     const phone=(d.getElementById('pcLeadPhone')?.value||'').trim();
     const type=d.getElementById('pcLeadType')?.value||'Não informado';
     const city=(d.getElementById('pcLeadCity')?.value||'').trim()||'Não informada';
     const tables=d.getElementById('pcLeadTables')?.value||'Não informado';
     if(!name||!establishment||!phone){frame.contentWindow.alert('Preencha seu nome, o nome do estabelecimento e seu WhatsApp.');return;}
     const source=(d.querySelector('header b')?.textContent||'Pede Comanda').trim();
     const msg='Olá! 👋 Vim através do Pede Comanda e tenho interesse em ter uma comanda digital no meu negócio.\n\n'+
     '👤 Nome: '+name+'\n'+
     '🏪 Estabelecimento: '+establishment+'\n'+
     '📱 WhatsApp: '+phone+'\n'+
     '🍔 Tipo de negócio: '+type+'\n'+
     '📍 Cidade: '+city+'\n'+
     '🪑 Mesas: '+tables+'\n\n'+
     '🔗 Conheci o Pede Comanda através de: '+source+'\n\n'+
     'Gostaria de saber mais sobre o Pede Comanda.';
     window.top.location.href='https://wa.me/5521972043295?text='+encodeURIComponent(msg);
   });
 }
}

frame.addEventListener('load',()=>{
 injectWidget();
 const d=frame.contentDocument;
 const app=d?.getElementById('app');
 if(app){
   const observer=new MutationObserver(()=>setTimeout(injectWidget,0));
   observer.observe(app,{childList:true,subtree:true});
 }
});
</script>
</body>
</html>
